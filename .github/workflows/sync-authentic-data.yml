name: Sync authentic data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run sync:data
      - name: Commit refreshed source cache
        run: |
          if git diff --quiet -- dist/data/opportunities.json dist/data/openreview.json; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/opportunities.json dist/data/openreview.json
          git commit -m "chore(data): refresh authentic opportunities"
          git push
